# Fabrique l'appli Android et la publie dans les « Releases » du dépôt.
# Se lance à chaque modification du dossier android-app/, ou à la main
# (onglet Actions > Appli Android > Run workflow).
name: Appli Android

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/appli-android.yml"
  workflow_dispatch:

permissions:
  contents: write   # pour créer la Release qui contient l'appli

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Déposer la clé de signature (secrets du dépôt)
        env:
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CLE_BASE64" ]; then
            echo "$CLE_BASE64" | base64 -d > "$RUNNER_TEMP/appli.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/appli.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de secret ANDROID_KEYSTORE_BASE64 : appli signée avec la clé de test."
          fi

      - name: Fabriquer l'appli
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer le fichier
        run: cp app/build/outputs/apk/release/app-release.apk all-your-tank.apk

      - name: Garder l'appli avec cette fabrication
        uses: actions/upload-artifact@v4
        with:
          name: all-your-tank
          path: android-app/all-your-tank.apk

      - name: Publier dans une Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: appli-v${{ github.run_number }}
          name: Appli Android ${{ github.run_number }}
          make_latest: true
          files: android-app/all-your-tank.apk
          body: |
            Appli Android All your tank (avec son widget).
            Sur le téléphone, touchez **all-your-tank.apk** ci-dessous pour la télécharger puis l'installer.
            Mode d'emploi : android-app/README.md
