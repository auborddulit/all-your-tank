<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Helvetica, Arial, sans-serif">
  <title>Schéma de câblage All your tank</title>
  <rect width="960" height="620" fill="#ffffff"/>

  <!-- ============ Fils (dessinés en premier, sous les boîtes) ============ -->
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Écran : GND, 3,3 V, SCL (A5), SDA (A4) -->
    <path d="M470 130 H700" stroke="#1d1d1f"/>
    <path d="M470 170 H700" stroke="#d62d20"/>
    <path d="M470 210 H700" stroke="#8b5a2b"/>
    <path d="M470 250 H700" stroke="#e8b800"/>
    <!-- Dérivations vers le bus des sondes -->
    <path d="M580 130 V480 H900" stroke="#1d1d1f"/>
    <path d="M610 170 V400 H900" stroke="#d62d20"/>
    <path d="M470 330 H640 V440 H900" stroke="#e8b800"/>
    <!-- Alimentation -> Nano -->
    <path d="M230 380 H330" stroke="#d62d20"/>
    <path d="M230 425 H330" stroke="#1d1d1f"/>
    <!-- Secteur -> alimentation -->
    <path d="M40 380 H60" stroke="#8b5a2b"/>
    <path d="M40 425 H60" stroke="#2f6fd6"/>
    <!-- Câbles des 3 sondes -->
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M714 400 V520" stroke="#d62d20"/><path d="M734 440 V520" stroke="#e8b800"/><path d="M754 480 V520" stroke="#1d1d1f"/>
    <path d="M784 400 V520" stroke="#d62d20"/><path d="M804 440 V520" stroke="#e8b800"/><path d="M824 480 V520" stroke="#1d1d1f"/>
    <path d="M854 400 V520" stroke="#d62d20"/><path d="M874 440 V520" stroke="#e8b800"/><path d="M894 480 V520" stroke="#1d1d1f"/>
  </g>
  <!-- Points de jonction -->
  <g fill="#1d1d1f">
    <circle cx="580" cy="130" r="6"/><circle cx="754" cy="480" r="5"/><circle cx="824" cy="480" r="5"/><circle cx="894" cy="480" r="5"/>
  </g>
  <g fill="#d62d20">
    <circle cx="610" cy="170" r="6"/><circle cx="714" cy="400" r="5"/><circle cx="784" cy="400" r="5"/><circle cx="854" cy="400" r="5"/><circle cx="672" cy="400" r="5"/>
  </g>
  <g fill="#e8b800">
    <circle cx="734" cy="440" r="5"/><circle cx="804" cy="440" r="5"/><circle cx="874" cy="440" r="5"/><circle cx="672" cy="440" r="5"/>
  </g>

  <!-- Résistance de tirage 4,7 kΩ entre données et 3,3 V -->
  <rect x="662" y="406" width="20" height="28" rx="3" fill="#f4ecd4" stroke="#1d1d1f" stroke-width="2.5"/>
  <text x="688" y="392" font-size="13" font-weight="700" fill="#1d1d1f">4,7 kΩ</text>

  <!-- ============ Arduino Nano ESP32 ============ -->
  <rect x="330" y="90" width="140" height="380" rx="10" fill="#1c5fa8"/>
  <text x="400" y="290" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Arduino</text>
  <text x="400" y="311" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Nano ESP32</text>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">
    <text x="460" y="135">GND</text>
    <text x="460" y="175">3.3V</text>
    <text x="460" y="215">A5</text>
    <text x="460" y="255">A4</text>
    <text x="460" y="335">D2</text>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff">
    <text x="340" y="385">5 V*</text>
    <text x="340" y="430">GND</text>
  </g>
  <g fill="#e9eef5" stroke="#0d3a6b" stroke-width="2">
    <circle cx="470" cy="130" r="6"/><circle cx="470" cy="170" r="6"/><circle cx="470" cy="210" r="6"/>
    <circle cx="470" cy="250" r="6"/><circle cx="470" cy="330" r="6"/><circle cx="330" cy="380" r="6"/><circle cx="330" cy="425" r="6"/>
  </g>
  <text x="478" y="350" font-size="12" fill="#555">(GPIO 5)</text>

  <!-- ============ Écran OLED ============ -->
  <rect x="700" y="90" width="210" height="190" rx="10" fill="#1f2a36"/>
  <rect x="760" y="108" width="132" height="154" rx="4" fill="#0b0d10" stroke="#3b4a5a" stroke-width="2"/>
  <text x="826" y="176" font-size="13" fill="#d9e4b0" text-anchor="middle">OLED 2,42"</text>
  <text x="826" y="194" font-size="13" fill="#d9e4b0" text-anchor="middle">SSD1309</text>
  <text x="826" y="212" font-size="13" fill="#d9e4b0" text-anchor="middle">I2C</text>
  <g font-size="13" font-weight="700" fill="#ffffff">
    <text x="712" y="135">GND</text>
    <text x="712" y="175">VCC</text>
    <text x="712" y="215">SCL</text>
    <text x="712" y="255">SDA</text>
  </g>
  <g fill="#e9eef5" stroke="#0d1117" stroke-width="2">
    <circle cx="700" cy="130" r="6"/><circle cx="700" cy="170" r="6"/><circle cx="700" cy="210" r="6"/><circle cx="700" cy="250" r="6"/>
  </g>

  <!-- ============ Sondes DS18B20 ============ -->
  <g fill="#c9ced6" stroke="#5f6670" stroke-width="2">
    <rect x="718" y="520" width="32" height="58" rx="5"/>
    <rect x="788" y="520" width="32" height="58" rx="5"/>
    <rect x="858" y="520" width="32" height="58" rx="5"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1d1d1f" text-anchor="middle">
    <text x="734" y="597">Cuve 1</text><text x="804" y="597">Cuve 2</text><text x="874" y="597">Cuve 3</text>
  </g>
  <text x="806" y="618" font-size="12" fill="#555" text-anchor="middle">Sondes DS18B20 inox</text>

  <!-- Étiquettes du bus -->
  <g font-size="12" fill="#555">
    <text x="905" y="404">3,3 V</text>
    <text x="905" y="444">data</text>
    <text x="905" y="484">GND</text>
  </g>

  <!-- ============ Alimentation ============ -->
  <rect x="60" y="340" width="170" height="125" rx="10" fill="#f2f2ef" stroke="#9a9a94" stroke-width="2"/>
  <text x="145" y="378" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">MEAN WELL</text>
  <text x="145" y="398" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">APV-8-5</text>
  <text x="145" y="420" font-size="13" fill="#555" text-anchor="middle">5 V · 1,4 A</text>
  <g font-size="12" font-weight="700" fill="#1d1d1f">
    <text x="196" y="375">+V</text><text x="200" y="440">−V</text>
    <text x="66" y="375">L</text><text x="66" y="440">N</text>
  </g>
  <text x="38" y="500" font-size="12" fill="#555">Secteur 230 V</text>
  <text x="38" y="516" font-size="12" fill="#555">L marron · N bleu</text>
  <text x="38" y="532" font-size="12" fill="#b3261e" font-weight="700">Électricien qualifié</text>

  <!-- ============ Titre, légende, note ============ -->
  <text x="30" y="44" font-size="24" font-weight="700" fill="#1d1d1f">Câblage</text>
  <text x="30" y="68" font-size="14" fill="#555">Couleurs : rouge = 3,3 V · noir = masse · jaune = données · marron = horloge I2C</text>
  <text x="30" y="590" font-size="12" fill="#555">* Borne 5 V de l'alimentation :</text>
  <text x="30" y="606" font-size="12" fill="#555">voir la note dans docs/materiel.md</text>
</svg>
